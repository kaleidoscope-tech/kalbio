[tool.poetry]
name = "kalbio"
version = "0.6.1"
description = "Python client for kaleidoscope.bio"
authors = ["Ahmed Elnaiem <ahmed@kaleidoscope.bio>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.9.2"
requests = "^2.32.3"
cachetools = "^6.2.5"
google-auth = { version = "^2.0.0", optional = true }

[tool.poetry.extras]
iap = ["google-auth"]

[tool.poetry.urls]
Homepage = "https://github.com/kaleidoscope-tech/kalbio"
Repository = "https://github.com/kaleidoscope-tech/kalbio"
Documentation = "https://api.docs.kaleidoscope.bio"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-mock = "^3.15.1"
mypy = "^2.3.0"
types-requests = "^2.33.0.20260712"
types-cachetools = "^7.0.0.20260713"

[tool.mypy]
plugins = ["pydantic.mypy"]

exclude = [
    "^docs/",
    "^site/",
    # "^kalbio/",
    # "^tests/",
    # "^tests/test_.+\\.py",
]

# google-auth is the optional `iap` extra and ships no type stubs.
[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
